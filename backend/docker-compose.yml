services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: education_postgres
    environment:
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: edupassword
      POSTGRES_DB: education_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - education_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduuser -d education_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: education_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: eduuser
      MONGO_INITDB_ROOT_PASSWORD: edupassword
      MONGO_INITDB_DATABASE: education_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/init-scripts/mongo:/docker-entrypoint-initdb.d
    networks:
      - education_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: education_redis
    command: redis-server --requirepass edupassword --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - education_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: education_backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://eduuser:edupassword@postgres:5432/education_db
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: edupassword
      POSTGRES_DB: education_db
      # MongoDB
      MONGODB_URI: mongodb://eduuser:edupassword@mongodb:27017/education_db?authSource=admin
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: edupassword
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - education_network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
networks:
  education_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local